# stitchgen parameters. All lengths are millimetres at the output size.

[size]
default_mm = 60.0          # avatar bounding box is scaled to fit this square

[colors]
max = 6                    # target 4-6 thread colours after palette mapping

[colors.roles]             # Humation colour slot -> thread brother_number, overriding the nearest colour
skin = "001"               # skin is stitched in White

[detail]
min_mm = 1.0               # parts smaller than this in both dimensions are dropped (warning)

[fill]
# Fills are straight stitches of random length (no tatami brick pattern) laid in rows that follow the motif.
angles = [45.0, 135.0]     # straight rows for parts without a flow, alternated between touching fills
row_spacing_mm = 0.3
max_stitch_length_mm = 4.0
random_jitter_percent = 35 # stitch length variation, hides needle-point patterns like long-and-short stitch
underlay = true
overlap_mm = 0.3           # fills grow under neighbouring satins to avoid gaps

[fill.flow]                # Humation colour slot -> row shape
hair = "arch"              # rows arch over the crown and fall down the sides
skin = "wrap"              # rows wrap round the face like latitude lines on a ball
clothes = "drape"          # rows fall vertically with a slight bow, like hanging cloth
bottom = "drape"

[thin]
threshold_mm = 2.5         # regions narrower than this become satin lines
satin_min_mm = 1.0          # lines keep their drawn width, but never narrower than this
satin_max_mm = 2.5
zigzag_spacing_mm = 0.35
spur_min_mm = 1.0          # skeleton branches shorter than this are pruned
simplify_mm = 0.1

[outline]
concavity_fill_mm = 2.5    # notches narrower than this are closed

[border]
width_mm = 2.5             # satin width (2.5-3.0 for a heat-cut edge)
inset_mm = 1.2             # how far the border reaches inside the silhouette: just over the drawn outer
                           # outline (~1 mm at 60 mm), which it replaces; the rest of the width lies outside
zigzag_spacing_mm = 0.38
color = "900"              # brother_number of the border / placement thread
placement_stitch_length_mm = 2.5

[guardrails]
max_stitches = 15000
max_color_changes = 8
max_dropped_ratio = 0.10

[export]
timeout_s = 180
stitches_per_minute = 600  # home machine speed for estimated_minutes

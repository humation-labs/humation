# stitchgen parameters. All lengths are millimetres at the output size.

[size]
default_mm = 60.0          # avatar bounding box is scaled to fit this square

[colors]
max = 6                    # target 4-6 thread colours after palette mapping

[colors.roles]             # Humation colour slot -> thread brother_number, overriding the nearest colour
skin = "001"               # skin is stitched in White

[detail]
min_mm = 1.0               # parts smaller than this in both dimensions are dropped (warning)

[fill]
# Wide areas are tatami laid in rows that follow the motif; anything narrower than satin_max_width_mm is satin.
pattern = "random"         # random: random stitch lengths, no needle-point pattern; regular: classic tatami stagger
satin_max_width_mm = 6.0   # narrower parts of a fill (petals, leaves, stems, strands) are satin instead of tatami
angles = [45.0, 135.0]     # straight rows for parts without a flow, alternated between touching fills
row_spacing_mm = 0.28
max_stitch_length_mm = 4.0
random_jitter_percent = 15 # pattern = random: stitch length variation
staggers = 4               # pattern = regular: rows repeat their needle points every this many rows
underlay = true
underlay_inset_mm = 0.3    # underlay stays this far inside the fill edge so it does not show
overlap_mm = 0.3           # fills grow under neighbouring satins to avoid gaps

[fill.flow]                # Humation colour slot -> row shape
hair = "arch"              # rows arch over the crown and fall down the sides
skin = "wrap"              # rows wrap round the face like latitude lines on a ball
clothes = "drape"          # rows fall vertically with a slight bow, like hanging cloth
bottom = "drape"

[thin]
threshold_mm = 2.5         # regions narrower than this become satin lines
satin_min_mm = 1.0          # lines keep their drawn width, but never narrower than this
satin_max_mm = 2.5
zigzag_spacing_mm = 0.33
pull_compensation_mm = 0.15 # satins shrink across their width when sewn
short_stitch_inset_percent = 40 # on tight curves alternate stitches stop this far short on the crowded side
short_stitch_distance_mm = 0.25 # ...wherever neighbouring stitches come closer than this
running_max_mm = 0.7       # lines thinner than this are a triple running stitch instead of a widened satin
running_stitch_length_mm = 1.5
spur_min_mm = 1.0          # skeleton branches shorter than this are pruned
simplify_mm = 0.1

[outline]
concavity_fill_mm = 2.5    # notches narrower than this are closed

[border]
# --border outline : (default) the outer line is sewn like the other lines.
# --border satin   : older patch style, a wide satin that replaces the drawn outer line and is the cut edge.
width_mm = 2.5             # satin mode width (2.5-3.0 for a heat-cut edge)
inset_mm = 1.2             # satin mode: how far it reaches inside the silhouette, just over the drawn outline
outline_width_mm = 1.1     # outline mode width; the whole satin lies inside the silhouette
zigzag_spacing_mm = 0.36
color = "900"              # brother_number of the border / placement thread
placement_stitch_length_mm = 2.5

[patch]
# --patch felt     : (default) embroider on white felt and cut it out along cutline.svg. Felt does not fray and the
#                    artwork's own outer line finishes the edge, so nothing is stitched around it.
# --patch stitched : stitched background margin and a satin heat-cut edge (for twill or other fraying fabric).
# --patch none     : direct embroidery on a garment.
cut_margin_mm = 1.5        # felt: cut line distance outside the outer line
felt = "#f7f7f4"           # felt colour for the preview
margin_mm = 2.0            # stitched: background between the artwork's outer line and the edge
edge_width_mm = 2.5        # stitched: heat-cut satin edge (2.5-3.0)
smooth_mm = 3.0            # cut line / edge closes notches up to about twice this
background = "001"         # stitched: brother_number of the background fill (White)
edge = "001"               # stitched: brother_number of the edge satin and placement run

[guardrails]
max_stitches = 15000
max_color_changes = 8
max_dropped_ratio = 0.10

[export]
timeout_s = 180
stitches_per_minute = 600  # home machine speed for estimated_minutes
